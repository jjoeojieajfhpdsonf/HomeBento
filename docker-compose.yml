services:
  homebento:
    build: .
    container_name: homebento
    restart: unless-stopped
    # host network: the dashboard reaches every service the way you do, and sees the host's name
    network_mode: host
    environment:
      - PORT=8095
      - TZ=Europe/Zurich
      - HOST_ROOT=/host            # disk usage of the host instead of the container
      # - PASSWORD=change-me       # optional login
      # - NOTIFY_URL=https://ntfy.sh/your-topic   # optional push when a service goes down
      # - CHECK_SECONDS=60
      # - TAILSCALE=off            # don't use Tailscale even if it's installed
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock   # list, start, stop, restart containers, logs
      - /:/host:ro
      # Tailscale Serve (services as https://<machine>.<tailnet>.ts.net:<port>): used when Tailscale
      # runs on the host, ignored otherwise. Remove the line (or set TAILSCALE=off) to leave it out.
      - /var/run/tailscale:/var/run/tailscale
