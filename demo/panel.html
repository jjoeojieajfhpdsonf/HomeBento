<!doctype html>
<html><head><meta charset="utf-8"><title>Panel</title>
<style>
	html, body { margin: 0; height: 100%; background: #181b1f; color: #ccccdc; font: 12px/1.4 Inter, system-ui, sans-serif; }
	.p { display: flex; flex-direction: column; height: 100%; padding: 10px 12px; box-sizing: border-box; }
	.h { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 6px; }
	.h span:last-child { color: #8e8e9b; font-weight: 400; }
	svg { flex: 1; width: 100%; }
	.l { display: flex; gap: 14px; color: #8e8e9b; margin-top: 4px; }
	.l i { display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; }
</style></head>
<body><div class="p">
	<div class="h"><span>Power consumption · whole house</span><span>Last 6 hours</span></div>
	<svg id="c" viewBox="0 0 600 160" preserveAspectRatio="none"></svg>
	<div class="l"><span><i style="background:#73bf69"></i>Solar</span><span><i style="background:#f2cc0c"></i>House</span><span><i style="background:#5794f2"></i>Grid</span></div>
</div>
<script>
// an example panel as it could come from Grafana (embedded with the "Web page" tile)
const c = document.getElementById("c");
function draw() {
	const t0 = Date.now() / 60000;
	const line = (f, color) => {
		let d = "";
		for (let i = 0; i <= 120; i++) d += `${i ? "L" : "M"}${(i * 5).toFixed(1)},${(150 - f(t0 - 120 + i) * 1.3).toFixed(1)}`;
		return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
	};
	const grid = [0, 40, 80, 120].map((y) => `<path d="M0,${150 - y}H600" stroke="#2c3235" vector-effect="non-scaling-stroke"/>`).join("");
	c.innerHTML = grid + line((x) => 70 + Math.sin(x / 40) * 35 + Math.sin(x / 7) * 6, "#73bf69") + line((x) => 40 + Math.sin(x / 13) * 12 + Math.sin(x / 3) * 4, "#f2cc0c") + line((x) => Math.max(2, 20 - Math.sin(x / 40) * 18), "#5794f2");
}
draw();
setInterval(draw, 5000);
</script></body></html>
