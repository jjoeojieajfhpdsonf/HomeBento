<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D · Kombi A+C</title>
<style>
:root {
	--bg: #101012; --tile: #1a1a1d; --tile-2: #222226; --line: rgba(255,255,255,.06);
	--text: #f2f2f3; --muted: #9a9aa2; --faint: #63636b;
	--ok: #5fd39a; --warn: #f5b83d; --bad: #ff6066; --accent: #9dbcff;
}
* { box-sizing: border-box; margin: 0; }
html { color-scheme: dark; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .sm { font-size: 12.5px; }
.wrap { max-width: 1880px; margin: 0 auto; padding: 20px 28px 60px; }
/* wide screens: content on the left, all services as a column on the right */
.layout { display: grid; grid-template-columns: 1fr; gap: 0 18px; }
@media (min-width: 1500px) {
	.layout { grid-template-columns: minmax(0, 1fr) 460px; align-items: start; }
	.layout aside { position: sticky; top: 16px; }
	.layout aside .sec { margin-top: 0; }
	.layout aside .row { grid-template-columns: 30px minmax(0, 1fr) 90px 56px 40px; gap: 10px; padding: 7px 14px; }
	.layout aside .row .stat, .layout aside .row .up { display: none; }
	.layout aside .row .spark { width: 90px; }
	.layout aside .acts { position: absolute; right: 10px; background: var(--tile); }
	.layout aside .row { position: relative; }
	.layout aside .rows { max-height: calc(100vh - 80px); overflow: auto; }
}
@media (min-width: 1800px) { .layout { grid-template-columns: minmax(0, 1fr) 520px; } .layout aside .row .stat { display: block; } .layout aside .row { grid-template-columns: 30px minmax(0, 1fr) 110px 90px 56px 40px; } }

.bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.tabs { display: flex; gap: 4px; background: var(--tile); padding: 4px; border-radius: 12px; }
.tabs button { padding: 6px 12px; border-radius: 9px; color: var(--muted); font-weight: 550; font-size: 13px; }
.tabs button.on { background: #2a2a2f; color: var(--text); }
.sp { flex: 1; }
.search { display: flex; align-items: center; gap: 9px; background: var(--tile); border-radius: 11px; padding: 0 12px; height: 38px; width: 320px; color: var(--faint); font-size: 13.5px; cursor: text; }
.search svg { width: 16px; height: 16px; }
.search kbd { margin-left: auto; font: 11px ui-monospace, monospace; background: var(--tile-2); color: var(--muted); padding: 2px 6px; border-radius: 6px; }
.btn { padding: 8px 14px; border-radius: 11px; background: var(--tile-2); font-weight: 560; font-size: 13px; white-space: nowrap; }
.btn:hover { background: #2a2a2f; }
.btn.primary { background: rgba(157,188,255,.15); color: var(--accent); }
.btn.busy { opacity: .5; pointer-events: none; }

/* A: what needs attention, as a strip */
.attention { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 12px; }
.issue { background: var(--tile); border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
.issue::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
.issue .grow { flex: 1; min-width: 0; }
.issue .it { font-weight: 600; }
.issue .d { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.allok { color: var(--muted); font-size: 13px; margin: 0 4px 12px; display: flex; align-items: center; gap: 8px; }
.allok i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

/* C: content tiles */
.bento { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); grid-auto-rows: 118px; grid-auto-flow: dense; gap: 12px; }
.t { background: var(--tile); border-radius: 22px; padding: 14px 16px; position: relative; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; min-width: 0; }
.t::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 80% at 0% 0%, color-mix(in srgb, var(--c, transparent) 14%, transparent), transparent 60%); pointer-events: none; }
.t > * { position: relative; }
.t.w2 { grid-column: span 2; } .t.w3 { grid-column: span 3; } .t.h2 { grid-row: span 2; } .t.h3 { grid-row: span 3; }
.th { display: flex; align-items: center; gap: 9px; }
.th .n { font-weight: 600; font-size: 13.5px; }
.th .meta { margin-left: auto; color: var(--faint); font-size: 12px; }
.big { font-size: 30px; font-weight: 620; letter-spacing: -.02em; line-height: 1.1; margin-top: 10px; }
.big small { font-size: 15px; color: var(--muted); font-weight: 500; }
.bottom { margin-top: auto; }
.logo { width: 26px; height: 26px; border-radius: 8px; background: var(--tile-2); display: grid; place-items: center; overflow: hidden; flex: none; font-weight: 700; font-size: 13px; color: var(--c); }
.logo img { width: 66%; height: 66%; }
.logo.glyph svg { width: 62%; height: 62%; color: var(--c); }
.bars { display: grid; gap: 9px; margin-top: 10px; }
.bars .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.track { height: 6px; border-radius: 6px; background: rgba(255,255,255,.07); margin-top: 4px; overflow: hidden; }
.fill { height: 100%; border-radius: 6px; background: var(--text); transition: width .8s; }
.posters { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: auto; }
.poster { aspect-ratio: 2/3; border-radius: 10px; display: flex; align-items: flex-end; padding: 6px; font-size: 10.5px; font-weight: 600; line-height: 1.2; color: rgba(255,255,255,.85); }
.nowp { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
.nowp .art { width: 46px; height: 64px; border-radius: 9px; background: linear-gradient(160deg, hsl(190 40% 45%), hsl(220 40% 20%)); flex: none; }
.prog { height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 6px; }
.prog i { display: block; height: 100%; background: var(--text); transition: width .8s; }
.cal .e { display: flex; gap: 10px; padding: 6px 0; align-items: center; }
.cal .e + .e { border-top: 1px solid var(--line); }
.cal .w { width: 86px; color: var(--muted); font-size: 12px; flex: none; }
.cal .tt { font-weight: 560; font-size: 13px; } .cal .ss { color: var(--faint); font-size: 12px; }
.dl .r + .r { margin-top: 9px; }
.dl .top { display: flex; justify-content: space-between; font-size: 12.5px; }
.dl .prog i { background: var(--accent); }
svg.curve { width: 100%; height: 56px; }

/* A: dense service list */
.sec { display: flex; align-items: baseline; gap: 10px; margin: 26px 4px 10px; }
.sec b { font-size: 15px; font-weight: 650; }
.sec .chips { display: flex; gap: 6px; margin-left: auto; }
.chip { padding: 4px 10px; border-radius: 99px; background: var(--tile); color: var(--muted); font-size: 12.5px; font-weight: 550; }
.chip.on { background: #2a2a2f; color: var(--text); }
.rows { background: var(--tile); border-radius: 22px; overflow: hidden; }
.group { color: var(--faint); font-size: 11.5px; font-weight: 600; letter-spacing: .04em; padding: 12px 16px 4px; }
.row { display: grid; grid-template-columns: 34px minmax(150px, 1.3fr) 1.1fr 130px 70px 70px 100px; align-items: center; gap: 14px; padding: 8px 16px; cursor: pointer; }
.row + .row { border-top: 1px solid var(--line); }
.row:hover { background: rgba(255,255,255,.02); }
.row .logo { width: 30px; height: 30px; border-radius: 9px; }
.row .n { font-weight: 560; display: flex; gap: 8px; align-items: center; }
.row .u { color: var(--faint); font-size: 12px; }
.row .stat { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ms, .row .up { text-align: right; color: var(--muted); font-size: 13px; }
.row .spark { width: 130px; height: 24px; color: rgba(157,188,255,.55); display: block; }
.row.warn .spark { color: var(--warn); }
.row.down .n, .row.down .stat { color: var(--muted); }
.pill { font-size: 11px; font-weight: 650; padding: 1px 7px; border-radius: 99px; }
.pill.down { background: rgba(255,96,102,.14); color: var(--bad); }
.pill.warn { background: rgba(245,184,61,.14); color: var(--warn); }
.pill.upd { background: rgba(157,188,255,.12); color: var(--accent); }
.acts { display: flex; gap: 2px; justify-content: flex-end; opacity: 0; transition: opacity .15s; }
.row:hover .acts { opacity: 1; }
.ib { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.ib:hover { background: var(--tile-2); color: var(--text); }
.ib svg { width: 16px; height: 16px; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 5; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 10px; right: 10px; bottom: 10px; width: 430px; max-width: calc(100% - 20px); background: var(--tile); border-radius: 24px; transform: translateX(110%); transition: transform .28s cubic-bezier(.2,.8,.2,1); overflow-y: auto; padding: 20px; z-index: 6; }
.drawer.on { transform: none; }
.dh { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
.dh .logo { width: 44px; height: 44px; border-radius: 12px; }
.dh b { font-size: 18px; display: block; }
.dh a { color: var(--muted); font-size: 12.5px; text-decoration: none; }
.dh .x { margin-left: auto; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.kpi { background: var(--tile-2); border-radius: 14px; padding: 10px 12px; }
.kpi .k { color: var(--faint); font-size: 11.5px; } .kpi .v { font-size: 17px; font-weight: 620; }
.chart { background: var(--tile-2); border-radius: 14px; padding: 12px; margin-bottom: 14px; }
.chart .spark { width: 100%; height: 70px; color: var(--accent); }
.kv { background: var(--tile-2); border-radius: 14px; }
.kv div { display: flex; justify-content: space-between; padding: 9px 12px; font-size: 13px; }
.kv div + div { border-top: 1px solid var(--line); }
.kv span:first-child { color: var(--muted); }
.dacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.log { font: 11.5px/1.6 ui-monospace, Menlo, monospace; background: #0d0d0f; border-radius: 14px; padding: 10px 12px; color: #b4b8c0; white-space: pre-wrap; margin-top: 12px; }

/* palette */
.pal { position: fixed; left: 50%; top: 14vh; width: 580px; max-width: calc(100% - 24px); transform: translate(-50%, -8px); opacity: 0; pointer-events: none; transition: .16s; background: #1c1c20; border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden; z-index: 7; }
.pal.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.pal input { width: 100%; background: none; border: 0; outline: none; color: var(--text); font: inherit; font-size: 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.pal .res { max-height: 360px; overflow: auto; padding: 6px; }
.pal .cap { color: var(--faint); font-size: 11.5px; padding: 8px 10px 4px; }
.pal .it { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.pal .it.sel { background: rgba(255,255,255,.07); }
.pal .it .k { margin-left: auto; color: var(--faint); font-size: 12px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; background: #2c2c32; padding: 10px 16px; border-radius: 12px; font-weight: 550; z-index: 9; }
.toast.on { opacity: 1; transform: translateX(-50%); }

@media (max-width: 1000px) { .row { grid-template-columns: 34px 1fr 110px 60px 90px; } .row .stat, .row .up { display: none; } }
@media (max-width: 640px) {
	.bento { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 104px; } .t.w3 { grid-column: span 2; }
	.posters { grid-template-columns: repeat(4, 1fr); } .posters .poster:nth-child(n+5) { display: none; }
	.search { width: 38px; padding: 0; justify-content: center; } .search .ph, .search kbd { display: none; }
	.row { grid-template-columns: 34px 1fr auto; } .row .spark-col, .row .ms, .acts { display: none; }
	.wrap { padding: 14px 12px 40px; }
}
</style>
</head>
<body>
<div class="wrap">
	<div class="bar">
		<div class="tabs" id="tabs"></div>
		<div class="sp"></div>
		<div class="search" onclick="openPal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="ph">Service, Aktion oder Link …</span><kbd>⌘K</kbd></div>
		<button class="btn">Bearbeiten</button>
	</div>

	<div class="layout">
		<main>
			<div id="attention"></div>
			<div class="bento" id="bento"></div>
		</main>
		<aside>
			<div class="sec"><b id="listTitle">Alle Services</b><span class="faint sm" id="count"></span></div>
			<div class="rows" id="rows"></div>
		</aside>
	</div>
</div>

<div class="scrim" id="scrim" onclick="closeAll()"></div>
<aside class="drawer" id="drawer"></aside>
<div class="pal" id="pal"><input id="palIn" placeholder="Suchen oder Befehl …" autocomplete="off"><div class="res" id="palRes"></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const I = {
	open: "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5'/></svg>",
	restart: "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 11a8 8 0 10-2.3 5.7M20 5v6h-6'/></svg>",
	logs: "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><path d='M5 6h14M5 12h14M5 18h9'/></svg>",
	info: "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><circle cx='12' cy='12' r='8.5'/><path d='M12 11v5M12 8h.01'/></svg>",
	x: "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round'><path d='M6 6l12 12M18 6L6 18'/></svg>"
};
// Each tab is a page for one area: its problems, its tiles, its services. "Übersicht" shows everything.
const PAGES = ["Übersicht", "Medien", "Zuhause", "System"];
let page = "Übersicht";
const inPage = (s) => page === "Übersicht" || s.group === page;
function tabs() {
	$("#tabs").innerHTML = PAGES.map((p) => `<button class="${p === page ? "on" : ""}" onclick="page='${p}';render()">${p}</button>`).join("");
}

// A: problems as a strip, each with its action
function attention() {
	const p = UTIL.problems().filter(inPage), u = UTIL.updates().filter(inPage);
	if (!p.length && !u.length) return ($("#attention").innerHTML = `<div class="allok"><i></i>Alles läuft · ${DATA.services.filter(inPage).length} Services</div>`);
	$("#attention").innerHTML = `<div class="attention">${p.map((s) => `<div class="issue" style="--c:${s.status === "down" ? "var(--bad)" : "var(--warn)"}">${UTIL.logo(s)}<div class="grow"><div class="it">${s.name} ${s.status === "down" ? "läuft nicht" : "ist langsam"}</div><div class="d">${s.note}</div></div>${s.status === "down" ? `<button class="btn primary" onclick="restart('${s.id}', this)">Starten</button>` : `<button class="btn" onclick="openDrawer('${s.id}', true)">Logs</button>`}</div>`).join("")}${u.length ? `<div class="issue" style="--c:var(--accent)"><span class="logo" style="color:var(--accent)">${I.restart}</span><div class="grow"><div class="it">${u.length} Updates</div><div class="d">${u.map((s) => s.name).join(", ")}</div></div><button class="btn primary" onclick="updateAll(this)">Alle</button></div>` : ""}</div>`;
}

// C: content tiles
function curve(values, color) {
	const w = 300, h = 56, max = Math.max(...values, 4.5);
	const pts = values.map((v, i) => [(i / 18) * w, h - (v / max) * (h - 4)]);
	const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");
	const last = pts[pts.length - 1];
	return `<svg class="curve" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="gs" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${last[0]},${h}L0,${h}Z" fill="url(#gs)"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function bento() {
	const s = DATA.solar, h = DATA.hosts[0], j = DATA.jellyfin, q = UTIL.byId("qbittorrent"), sol = UTIL.byId("solar"), jf = UTIL.byId("jellyfin");
	const bar = (k, v, txt) => `<div><div class="top"><span>${k}</span><span class="num">${txt}</span></div><div class="track"><div class="fill" style="width:${v}%"></div></div></div>`;
	// tiles per page: what belongs to the area
	const T = {
		solar: `<div class="t w2 h2" style="--c:${sol.color}" onclick="openDrawer('solar')"><div class="th">${UTIL.logo(sol)}<span class="n">Solar</span><span class="meta">jetzt</span></div><div class="big num">${s.now.toFixed(1)}<small> kW</small></div><div class="sm muted">heute ${s.today} kWh · Haus ${s.use} kW</div><div class="bottom">${curve(s.curve, sol.color)}</div></div>`,
		host: `<div class="t w2 h2" style="--c:#9dbcff"><div class="th"><span class="n">${h.name}</span><span class="meta">${h.temp}° · ${h.uptime}</span></div><div class="bars">${bar("CPU", h.cpu, h.cpu + " %")}${bar("Speicher", h.ram, h.ram + " %")}${bar("Platte", h.disk, h.diskText)}</div><div class="sm faint bottom">↓ 2.1 MB/s · ↑ 340 KB/s</div></div>`,
		pi: `<div class="t w2 h2" style="--c:#9aa4b2"><div class="th"><span class="n">${DATA.hosts[1].name}</span><span class="meta">${DATA.hosts[1].temp}° · ${DATA.hosts[1].uptime}</span></div><div class="bars">${bar("CPU", DATA.hosts[1].cpu, DATA.hosts[1].cpu + " %")}${bar("Speicher", DATA.hosts[1].ram, DATA.hosts[1].ram + " %")}${bar("Platte", DATA.hosts[1].disk, DATA.hosts[1].diskText)}</div></div>`,
		cal: `<div class="t w2 h2" style="--c:#35c5f4"><div class="th"><span class="n">Demnächst</span><span class="meta">Sonarr · Radarr</span></div><div class="cal">${DATA.upcoming.slice(0, 4).map((e) => `<div class="e"><span class="w">${e.when}</span><div><div class="tt">${e.title}</div><div class="ss">${e.sub}</div></div></div>`).join("")}</div></div>`,
		jf: `<div class="t w3 h3" style="--c:${jf.color}" onclick="openDrawer('jellyfin')"><div class="th">${UTIL.logo(jf)}<span class="n">Jellyfin</span><span class="meta">${jf.stat}</span></div><div class="nowp"><div class="art"></div><div style="flex:1"><div style="font-weight:600">${j.now.title}</div><div class="sm muted">${j.now.sub} · ${j.now.user} auf ${j.now.device}</div><div class="prog"><i style="width:${(j.now.progress * 100).toFixed(1)}%"></i></div></div></div><div class="sm muted" style="margin-top:auto">Neu hinzugefügt</div><div class="posters" style="margin-top:8px">${j.recent.map((r) => `<div class="poster" style="background:linear-gradient(170deg,hsl(${r.hue} 45% 42%),hsl(${r.hue + 30} 40% 16%))">${r.title}</div>`).join("")}</div></div>`,
		dl: `<div class="t w3 h1" style="--c:${q.color}" onclick="openDrawer('qbittorrent')"><div class="th">${UTIL.logo(q)}<span class="n">Downloads</span><span class="meta num">${q.stat}</span></div><div class="dl bottom">${DATA.torrents.filter((t) => t.progress < 1).slice(0, 1).map((t) => `<div class="r"><div class="top"><span>${t.name}</span><span class="muted num">${Math.round(t.progress * 100)} %</span></div><div class="prog"><i style="width:${(t.progress * 100).toFixed(1)}%"></i></div></div>`).join("")}</div></div>`,
		notes: `<div class="t w3 h2" style="--c:#5fd39a"><div class="th"><span class="n">Notizen</span></div><div class="sm" style="margin-top:8px;display:grid;gap:5px"><label><input type="checkbox" checked> Backup prüfen</label><label><input type="checkbox"> Sonarr-Serien eintragen</label><label><input type="checkbox"> FlareSolverr Speicher erhöhen</label></div></div>`,
		mirror: `<div class="t w2 h1" style="--c:#9aa4b2"><div class="th">${UTIL.logo(UTIL.byId("magicmirror"))}<span class="n">MagicMirror</span><span class="meta">11 Module</span></div><div class="sm muted bottom">läuft · Halloween-Overlay aktiv</div></div>`
	};
	const layout = { "Übersicht": ["solar", "host", "cal", "jf", "dl", "notes"], Medien: ["jf", "cal", "dl"], Zuhause: ["solar", "mirror", "pi", "notes"], System: ["host", "pi"] }[page];
	$("#bento").innerHTML = layout.map((k) => T[k]).join("");
}

// A: the dense list, with a filter instead of many small tiles
function list() {
	const items = DATA.services.filter(inPage);
	$("#listTitle").textContent = page === "Übersicht" ? "Alle Services" : `Services · ${page}`;
	$("#count").textContent = `${items.length}`;
	const byGroup = [...new Set(items.map((s) => s.group))];
	$("#rows").innerHTML = byGroup.map((g) => `${page === "Übersicht" ? `<div class="group">${g.toUpperCase()}</div>` : ""}${items.filter((s) => s.group === g).map(row).join("")}`).join("");
}
function row(s) {
	const pill = s.status === "down" ? `<span class="pill down">gestoppt</span>` : s.status === "warn" ? `<span class="pill warn">langsam</span>` : s.container && s.container.update ? `<span class="pill upd">Update</span>` : "";
	return `<div class="row ${s.status}" data-id="${s.id}" onclick="window.open('${s.url}')">${UTIL.logo(s)}
		<div><div class="n">${s.name} ${pill}</div><div class="u">${UTIL.hostPort(s.url)}</div></div>
		<div class="stat">${s.stat}</div><div class="spark-col">${UTIL.spark(s.history, 130, 24)}</div>
		<div class="ms num">${UTIL.fmtMs(s.ms)}</div><div class="up num">${s.uptime} %</div>
		<div class="acts" onclick="event.stopPropagation()"><button class="ib" title="Neu starten" onclick="restart('${s.id}', this)">${I.restart}</button><button class="ib" title="Logs" onclick="openDrawer('${s.id}', true)">${I.logs}</button><button class="ib" title="Details" onclick="openDrawer('${s.id}')">${I.info}</button></div></div>`;
}

function openDrawer(id, logs) {
	const s = UTIL.byId(id), c = s.container;
	$("#drawer").innerHTML = `<div class="dh">${UTIL.logo(s)}<div><b>${s.name}</b><a href="${s.url}" target="_blank">${UTIL.hostPort(s.url)}</a></div><button class="ib x" onclick="closeAll()">${I.x}</button></div>
		<div class="kpis"><div class="kpi"><div class="k">Antwort</div><div class="v num">${UTIL.fmtMs(s.ms)}</div></div><div class="kpi"><div class="k">30 Tage</div><div class="v num">${s.uptime} %</div></div><div class="kpi"><div class="k">${c ? "CPU" : "Prozess"}</div><div class="v num">${c ? c.cpu + " %" : "pm2"}</div></div></div>
		<div class="chart">${UTIL.spark(s.history, 360, 70)}</div>
		<div class="kv">${c ? `<div><span>Image</span><span>${c.image}</span></div><div><span>RAM</span><span>${c.ram} MB</span></div>` : `<div><span>Läuft als</span><span>${s.process}</span></div>`}</div>
		<div class="dacts"><a class="btn primary" style="text-decoration:none" href="${s.url}" target="_blank">Öffnen</a><button class="btn" onclick="restart('${s.id}', this)">${s.status === "down" ? "Starten" : "Neu starten"}</button></div>
		${logs ? `<div class="log">${s.status === "down" ? "09:52:19 WARN Memory usage 1.9 GB\n09:52:21 Killed (exit 137)" : "11:58:01 INFO Health check ok\n11:59:01 INFO Health check ok"}</div>` : ""}`;
	$("#drawer").classList.add("on");
	$("#scrim").classList.add("on");
}
function closeAll() { $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); $("#pal").classList.remove("on"); }
async function restart(id, btn) {
	const s = UTIL.byId(id);
	btn && btn.classList.add("busy");
	toast(`${s.name} wird ${s.status === "down" ? "gestartet" : "neu gestartet"} …`);
	await UTIL.act();
	if (s.status === "down") Object.assign(s, { status: "up", ms: 140, stat: "läuft wieder" });
	toast(`${s.name} läuft`);
	render();
}
async function updateAll(btn) {
	btn.classList.add("busy");
	for (const s of UTIL.updates()) { await UTIL.act(null, 500); s.container.update = false; }
	toast("Alle aktuell");
	render();
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2200); }

// ⌘K
let sel = 0, results = [];
function openPal() { $("#pal").classList.add("on"); $("#scrim").classList.add("on"); $("#palIn").value = ""; palRender(); $("#palIn").focus(); }
function palRender() {
	const q = $("#palIn").value.trim().toLowerCase(), m = (x) => !q || x.toLowerCase().includes(q);
	results = [];
	for (const s of DATA.services) if (m(s.name)) results.push({ cap: "Services", html: `${UTIL.logo(s)}<span>${s.name}</span><span class="k">${UTIL.hostPort(s.url)}</span>`, run: () => window.open(s.url) });
	for (const s of DATA.services) if (q && m(s.name)) results.push({ cap: "Aktionen", html: `<span class="logo" style="color:var(--muted)">${I.restart}</span><span>${s.name} ${s.status === "down" ? "starten" : "neu starten"}</span>`, run: () => restart(s.id) });
	if (q) results.push({ cap: "Web", html: `<span class="logo" style="color:var(--muted)">↗</span><span>«${q}» im Web suchen</span>`, run: () => window.open("https://duckduckgo.com/?q=" + encodeURIComponent(q)) });
	results = results.slice(0, 10);
	sel = Math.min(sel, results.length - 1);
	let last = null;
	$("#palRes").innerHTML = results.map((r, i) => { const cap = r.cap !== last ? `<div class="cap">${r.cap}</div>` : ""; last = r.cap; return `${cap}<div class="it ${i === sel ? "sel" : ""}" onclick="palRun(${i})">${r.html}</div>`; }).join("");
}
function palRun(i) { const r = results[i]; closeAll(); r && r.run(); }
$("#palIn").addEventListener("input", () => { sel = 0; palRender(); });
document.addEventListener("keydown", (e) => {
	if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); openPal(); }
	if (e.key === "Escape") closeAll();
	if ($("#pal").classList.contains("on")) {
		if (e.key === "ArrowDown") { sel = Math.min(results.length - 1, sel + 1); palRender(); e.preventDefault(); }
		if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); palRender(); e.preventDefault(); }
		if (e.key === "Enter") palRun(sel);
	}
});

function render() { tabs(); attention(); bento(); list(); }
render();
UTIL.live(() => {
	bento();
	for (const s of DATA.services) { const r = document.querySelector(`.row[data-id="${s.id}"]`); if (r) { r.querySelector(".ms").textContent = UTIL.fmtMs(s.ms); r.querySelector(".stat").textContent = s.stat; } }
});
</script>
</body>
</html>
