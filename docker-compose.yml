services:
  homebento:
    build: .
    container_name: homebento
    restart: unless-stopped
    # host network: the dashboard reaches every service the way you do, and sees the host's name
    network_mode: host
    environment:
      - PORT=8095
      - TZ=Europe/Zurich
      - HOST_ROOT=/host            # disk usage of the host instead of the container
      # - PASSWORD=change-me       # optional login
      # - NOTIFY_URL=https://ntfy.sh/your-topic   # optional push when a service goes down
      # - CHECK_SECONDS=60
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock   # list, start, stop, restart containers, logs
      - /:/host:ro
      # optional: manage Tailscale Serve (services as https://<machine>.<tailnet>.ts.net:<port>)
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
